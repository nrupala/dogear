version = 1

# Own artwork (launcher icons, splash screens, notification icons, site pups,
# store icon) — ships under the project's licence; declared here because PNG
# files cannot carry SPDX headers.
[[annotations]]
path = [
    "android/app/src/main/res/**",
    "android/store_icon.png",
    "extension/icons/**",
    "site/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 2351485 ALBERTA INC."
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vendored reader-core (our own repo, nrupala/reader-core v0.2.0 per
# extension/vendor/reader-core/PIN.json) — keeps its own Apache-2.0 licence.
[[annotations]]
path = "extension/vendor/reader-core/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 2351485 ALBERTA INC."
SPDX-License-Identifier = "Apache-2.0"

# Gradle wrapper (generated by Gradle; distributed by Gradle Inc. under
# Apache-2.0).
[[annotations]]
path = [
    "android/gradle/wrapper/gradle-wrapper.jar",
    "android/gradle/wrapper/gradle-wrapper.properties",
    "android/gradlew",
    "android/gradlew.bat",
]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"

# Generated lockfile — produced from package.json (AGPL-3.0-or-later) by npm.
[[annotations]]
path = "package-lock.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 2351485 ALBERTA INC."
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated bundle manifest — produced by android/tools/bundle_web.py
# from the committed tree (sha256 + size per staged file); a generated
# project file, declared here because JSON cannot carry a header.
[[annotations]]
path = "android/bundle-manifest.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 2351485 ALBERTA INC."
SPDX-License-Identifier = "AGPL-3.0-or-later"
