name: Android release

# DogEar Android packages are built HERE, from source, never hand-assembled
# locally. Push a version tag (v*) to cut a release, or run manually to get
# signed artifacts from the run.
#
# Declare -> certify (declare-certify inbuilding, step 4 — PILOT on this
# branch): the release is DECLARED by the gate job before anything is
# built, the declaration record travels between jobs as a workflow
# artifact, the certification job closes it against the build evidence,
# and the publish job guards on the closed record — while the
# declaration is OPEN, the release cannot be attached. Actions:
# nrupala/platform-ci-scaffolding/declare-certify (pinned by commit).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: the workflow token reads by default; the one job that
# attaches artifacts to a release declares its write scope itself.
permissions:
  contents: read

jobs:
  declare:
    name: Declare the release (gate)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      declaration-id: ${{ steps.declare.outputs.declaration-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate job's verdict. Pilot scope: the checks this job can
      # honestly run from its own context (release identity — the tag,
      # the commit it resolves to, the run recording them), plus the
      # downstream gates the build job enforces before certification
      # (bundle-manifest verification, signer identity assertion,
      # bundletool validation). Wiring the full release-gate verdict
      # into this file is the release-gate lane's follow-on.
      - name: Gate checks + write the gate verdict
        id: gate
        run: |
          set -eu
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="manual-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          VERSION="$(echo "$VERSION" | tr '/' '-')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "gate verdict: DECLARED (pilot wiring)"
            echo "target: dogear"
            echo "version: $VERSION"
            echo "base: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "identity checks: tag/commit recorded from the Actions context of this run"
            echo "downstream gates (build job, before certify): bundle-manifest verification, signer identity assertion, bundletool validation"
          } > gate-verdict.md
          cat gate-verdict.md

      - name: Declare the release
        id: declare
        uses: nrupala/platform-ci-scaffolding/declare-certify/declare@35c8c282f6d508568196647d756f1d5929c7538e
        with:
          target: dogear
          version: ${{ steps.gate.outputs.version }}
          base: ${{ github.sha }}
          gate-verdict: gate-verdict.md

  build:
    name: Build
    needs: declare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu image already ships the Android SDK + cmdline-tools; the
      # setup-android action's legacy 'tools' package install is what broke
      # the first run (2026-10-22), so sdkmanager is driven directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # The bundled app: stage the web tree into the shell's assets
      # from the LIVE endpoints (the same bytes the Worker serves),
      # verified file-by-file against the committed bundle-manifest
      # (sha256 + size). A mismatch fails the build — the bundle
      # ships the gated tree or it does not ship.
      - name: Stage bundled web tree (verified against bundle-manifest)
        run: |
          python3 tools/bundle_web.py --stage \
            --manifest bundle-manifest.json \
            --out app/src/main/assets/web \
            --from-live https://app.getdogear.app

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.DOGEAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DOGEAR_KEYSTORE_BASE64 secret is not set — refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dogear.keystore"

      - name: Build release APK + AAB (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign artifacts + assert signer identity
        env:
          STORE_PASSWORD: ${{ secrets.DOGEAR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DOGEAR_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: 95b84a3e0977ff25e3d1e7a07acb5092323fd45709c158eb716de1cd19957ff0
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          KS="$RUNNER_TEMP/dogear.keystore"
          # APK: zipalign, then sign (AGP leaves it unsigned — no signingConfig in the project)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/dogear-aligned.apk"
          KS_PASS="$STORE_PASSWORD" KEY_PASS="$KEY_PASSWORD" "$BT/apksigner" sign \
            --ks "$KS" --ks-key-alias android \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/dogear.apk" "$RUNNER_TEMP/dogear-aligned.apk"
          # AAB: jarsigner, like the Bubblewrap pipeline
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dogear.aab"
          jarsigner -keystore "$KS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$GITHUB_WORKSPACE/dogear.aab" android
          # The signer assertion: the certificate that signs our packages must be
          # the one assetlinks.json trusts, or the TWA will not verify.
          CERT=$("$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/dogear.apk" \
            | grep 'certificate SHA-256 digest' | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256: $CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signer mismatch — expected $EXPECTED_CERT_SHA256, got $CERT. Refusing to publish."
            exit 1
          fi
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/dogear.apk"
          jarsigner -verify "$GITHUB_WORKSPACE/dogear.aab"

      - name: Validate the bundle (bundletool)
        run: |
          curl -sL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle "$GITHUB_WORKSPACE/dogear.aab"

      # The certification evidence: exactly what was built, by hash.
      - name: Write the release evidence
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "target: dogear"
            echo "version: ${{ needs.declare.outputs.version }}"
            echo "base: ${GITHUB_SHA}"
            sha256sum dogear.apk dogear.aab
          } > release-evidence.txt
          cat release-evidence.txt

      - name: Upload run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dogear-android
          path: |
            dogear.apk
            dogear.aab
            release-evidence.txt

  certify:
    name: Certify the release
    needs: [declare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the build artifacts (for the evidence file)
        uses: actions/download-artifact@v8
        with:
          name: dogear-android

      - name: Certify the release against the build evidence
        uses: nrupala/platform-ci-scaffolding/declare-certify/certify@35c8c282f6d508568196647d756f1d5929c7538e
        with:
          declaration-id: ${{ needs.declare.outputs.declaration-id }}
          evidence: release-evidence.txt
          note: "dogear android release ${{ needs.declare.outputs.version }}"

  publish:
    name: Publish to the GitHub release (tag builds)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [declare, certify]
    permissions:
      contents: write
      # Build-provenance attestation (SLSA L2 via Sigstore) for release artifacts
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # The guard: downloads the CLOSED declaration record and fails
      # this job while it is OPEN — the attach below is unreachable
      # for an uncertified release.
      - name: Guard — the declaration must be CLOSED
        uses: nrupala/platform-ci-scaffolding/declare-certify/guard@35c8c282f6d508568196647d756f1d5929c7538e
        with:
          declaration-id: ${{ needs.declare.outputs.declaration-id }}

      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dogear-android

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dogear.apk dogear.aab --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dogear.apk
            dogear.aab
