name: Android release

# DogEar Android packages are built HERE, from source, never hand-assembled
# locally. Push a version tag (v*) to cut a release, or run manually to get
# signed artifacts from the run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu image already ships the Android SDK + cmdline-tools; the
      # setup-android action's legacy 'tools' package install is what broke
      # the first run (2026-10-22), so sdkmanager is driven directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # The bundled app: stage the web tree into the shell's assets
      # from the LIVE endpoints (the same bytes the Worker serves),
      # verified file-by-file against the committed bundle-manifest
      # (sha256 + size). A mismatch fails the build — the bundle
      # ships the gated tree or it does not ship.
      - name: Stage bundled web tree (verified against bundle-manifest)
        run: |
          python3 tools/bundle_web.py --stage \
            --manifest bundle-manifest.json \
            --out app/src/main/assets/web \
            --from-live https://app.getdogear.app

      # JVM unit tests (redesign: Chunker fixture parity with the
      # pinned engine, self-model routing, failure-speech census,
      # document store + marks cascade, PlayerCore suite). A red
      # suite fails the run before anything is signed.
      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.DOGEAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DOGEAR_KEYSTORE_BASE64 secret is not set — refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dogear.keystore"

      - name: Build release APK + AAB (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign artifacts + assert signer identity
        env:
          STORE_PASSWORD: ${{ secrets.DOGEAR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DOGEAR_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: 95b84a3e0977ff25e3d1e7a07acb5092323fd45709c158eb716de1cd19957ff0
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          KS="$RUNNER_TEMP/dogear.keystore"
          # APK: zipalign, then sign (AGP leaves it unsigned — no signingConfig in the project)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/dogear-aligned.apk"
          KS_PASS="$STORE_PASSWORD" KEY_PASS="$KEY_PASSWORD" "$BT/apksigner" sign \
            --ks "$KS" --ks-key-alias android \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/dogear.apk" "$RUNNER_TEMP/dogear-aligned.apk"
          # AAB: jarsigner, like the Bubblewrap pipeline
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dogear.aab"
          jarsigner -keystore "$KS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$GITHUB_WORKSPACE/dogear.aab" android
          # The signer assertion: the certificate that signs our packages must be
          # the one assetlinks.json trusts, or the TWA will not verify.
          CERT=$("$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/dogear.apk" \
            | grep 'certificate SHA-256 digest' | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256: $CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signer mismatch — expected $EXPECTED_CERT_SHA256, got $CERT. Refusing to publish."
            exit 1
          fi
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/dogear.apk"
          jarsigner -verify "$GITHUB_WORKSPACE/dogear.aab"

      - name: Validate the bundle (bundletool)
        run: |
          curl -sL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle "$GITHUB_WORKSPACE/dogear.aab"

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dogear-android
          path: |
            dogear.apk
            dogear.aab

      - name: Attach to the GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: gh release upload "$GITHUB_REF_NAME" dogear.apk dogear.aab --clobber
