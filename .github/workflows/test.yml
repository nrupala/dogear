name: test

# The repo's unit tests, run in CI on every push: the Android shell's
# JUnit suite (android/app/src/test — PlayerCore and friends). Until
# this workflow existed, no CI job ran a test step in this repo (the
# 2026-11-07 OpenSSF readiness finding test_continuous_integration).
# The run also prints the merged manifest's backup posture, so the
# allowBackup=false gate fix is proven from the built artifact in the
# run log, not just from the source file.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # Same SDK route as the release workflow: the ubuntu image ships
      # the Android SDK; sdkmanager is driven directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests (JUnit, debug variant)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Proof — merged manifest backup posture
        run: |
          MANIFEST=$(find app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -1)
          echo "merged manifest: $MANIFEST"
          grep -o 'android:allowBackup="[^"]*"' "$MANIFEST"
          if grep -q 'android:allowBackup="true"' "$MANIFEST"; then
            echo "::error::allowBackup is true in the BUILT manifest — the gate fix did not reach the artifact."
            exit 1
          fi
          echo "built manifest carries allowBackup=false"
