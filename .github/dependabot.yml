# Dependabot: keeps the GitHub Actions pins, the Gradle build, and the
# npm lint/test tooling current. Added 2026-11-07 — the repo had no
# dependency-update tool configured (OpenSSF Scorecard
# DependencyUpdateTool finding).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # All CodeQL action steps in a workflow must run the same version;
      # bump them together so init/analyze never skew (PR #19 failure).
      codeql-action:
        patterns:
          - "github/codeql-action"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/extension/tests"
    schedule:
      interval: "weekly"

